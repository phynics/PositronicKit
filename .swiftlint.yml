# Source guardrail enforcement.
#
# Only the reviewed custom rules below run — no default rules. Rules are GLOBAL:
# any occurrence fails the gate (`swiftlint lint --strict`).
#
# The concurrency rules flag anti-patterns the reference-box elimination work
# banned. Any occurrence needs an inline `// swiftlint:disable:this` annotation;
# the annotation on each site's own line carries the reviewer's justification,
# and docs/Concurrency/exception-manifest.md is the source of truth.
#
# `syntax_optional_existential_parentheses` enforces the SE-0521 `any P?`
# spelling adopted in #200. Fix the spelling rather than annotating the site.

only_rules:
  - concurrency_unchecked_sendable
  - concurrency_manual_nslock
  - concurrency_stored_continuation
  - concurrency_stored_task
  - concurrency_reference_box_naming
  - syntax_optional_existential_parentheses

excluded:
  - .build
  - DerivedData
  - .git

custom_rules:
  # @unchecked Sendable survives only where a reviewed external-framework
  # boundary or test double justifies it (site-annotated; see manifest).
  concurrency_unchecked_sendable:
    regex: '@unchecked[[:space:]]+Sendable'
    message: 'Un-annotated @unchecked Sendable conformance. Every exception needs an inline annotation; the source of truth is docs/Concurrency/exception-manifest.md.'
    severity: error

  # Manual NSLock lock-boxes are banned in favor of Synchronization.Mutex<State>.
  concurrency_manual_nslock:
    regex: '\bNSLock\(\)'
    message: 'Manual NSLock box. Use Synchronization.Mutex<State> (see exception manifest).'
    severity: error

  # Stored continuation properties are banned outside an explicit lifecycle state
  # machine owned by an actor or mutex.
  concurrency_stored_continuation:
    regex: '\b(var|let)[[:space:]]+[A-Za-z_][A-Za-z0-9_]*[[:space:]]*:[[:space:]]*(CheckedContinuation|UnsafeContinuation|Async(Throwing)?Stream[[:space:]]*<[^>]*>[[:space:]]*\.Continuation)'
    message: 'Stored continuation. Use an explicit lifecycle state machine owned by an actor or mutex (see exception manifest).'
    severity: error

  # Stored Task properties are banned outside the actor/@MainActor owner of the
  # task's cancellation.
  concurrency_stored_task:
    regex: '\b(var|let)[[:space:]]+[A-Za-z_][A-Za-z0-9_]*[[:space:]]*:[[:space:]]*Task<'
    message: 'Stored Task outside its owning actor/service (see exception manifest).'
    severity: error

  # Generic reference-box type names are banned; ownership must be explicit
  # rather than hidden behind a Box/Cell/Holder cell.
  concurrency_reference_box_naming:
    regex: '\b(class|actor|struct|enum)[[:space:]]+[A-Za-z_]*(Box|Cell|Holder)'
    message: 'Generic reference-box type name. Choose explicit ownership instead (see exception manifest).'
    severity: error

  # Optional existential sugar (SE-0521, #200): `(any P)?` and `(some P)?` are
  # the redundant spellings. This only matches a bare optional existential (with
  # an optional generic argument list), so existential metatypes
  # (`(any P).self`), tuples, and protocol compositions are not flagged.
  syntax_optional_existential_parentheses:
    regex: '\((any|some)[[:space:]]+[A-Za-z_][A-Za-z0-9_.]*(<[^()]*>)?\)\?'
    message: 'Redundant parentheses around an optional existential. Write `any P?` (SE-0521).'
    severity: error