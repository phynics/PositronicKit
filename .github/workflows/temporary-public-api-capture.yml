name: Temporary public API capture

on:
  push:
    branches:
      - feature/repair-public-api-sy-uiq

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            curl \
            perl \
            libdigest-sha-perl \
            python3 \
            git

      - name: Generate Linux public API inventory
        run: python3 Scripts/public-api-baseline.py --write

      - name: Publish generated inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-api-linux-inventory
          path: api/4.0-public-api-linux.json
