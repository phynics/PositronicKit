name: Release SBOM

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to generate and attach an SBOM for"
        required: true

permissions:
  actions: read
  contents: write

# Every `run:` step uses an explicit `bash` shell so GitHub Actions applies `-eo pipefail`.
defaults:
  run:
    shell: bash

jobs:
  attach-sbom:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    name: "Attach CycloneDX SBOM (Ubuntu 24.04)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .trusted-release-tools-${{ github.run_id }}
          persist-credentials: false

      - name: Resolve the release checkout commit
        id: release
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: >-
          python3 .trusted-release-tools-${{ github.run_id }}/Scripts/release-sbom-gate.py resolve-tag
          --tag "$TAG" --repository . >> "$GITHUB_OUTPUT"

      - name: Select a gate run whose provenance matches the release checkout
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          python3 .trusted-release-tools-${{ github.run_id }}/Scripts/release-sbom-gate.py select \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --commit "$COMMIT" \
            --directory .build/gate >> "$GITHUB_OUTPUT"

      - name: Attach the SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          GATE_DIR: ${{ steps.gate.outputs.directory }}
        run: gh release upload "$TAG" "$GATE_DIR/PositronicKit-${TAG}.cyclonedx.json" --clobber
