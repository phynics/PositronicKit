name: Temporary macOS API baseline for issue 166

on:
  push:
    branches:
      - codex/issue-166-thread-history

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  generate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Cache SwiftPM downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .build/checkouts
            ~/.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      - name: Generate macOS public API baseline
        run: make update-public-api-baseline

      - name: Upload macOS public API baseline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-api-baseline-issue-166
          path: api/5.1-public-api-macos.json
