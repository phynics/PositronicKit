name: Nightly flake detection

on:
  schedule:
    # 03:17 UTC daily. Reports only — this workflow never gates pull requests.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      iterations:
        description: "Full-suite repetitions"
        required: false
        default: "5"

permissions:
  contents: read

# Every `run:` step uses an explicit `bash` shell so GitHub Actions applies `-eo pipefail`.
defaults:
  run:
    shell: bash

env:
  SWIFT_TOOLCHAIN_VERSION: "6.4.0"

jobs:
  flake-detection:
    name: "Linux — full suite N times, report flakes (Ubuntu 24.04)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Swift ${{ env.SWIFT_TOOLCHAIN_VERSION }}
        run: |
          set -euo pipefail
          archive="swift-${SWIFT_TOOLCHAIN_VERSION}-RELEASE-ubuntu24.04.tar.gz"
          curl -fsSL -o "/tmp/${archive}" \
            "https://download.swift.org/swift-${SWIFT_TOOLCHAIN_VERSION}-release/ubuntu2404/swift-${SWIFT_TOOLCHAIN_VERSION}-RELEASE/${archive}"
          sudo mkdir -p /opt/swift
          sudo tar -xzf "/tmp/${archive}" -C /opt/swift --strip-components=1
          echo "/opt/swift/usr/bin" >> "$GITHUB_PATH"

      - name: Assert Swift 6.4
        run: swift --version | tee /dev/stderr | grep -q 'Swift version 6\.4'

      - name: Cache SwiftPM downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/checkouts
            ~/.swiftpm
          key: swiftpm-${{ runner.os }}-swift-${{ env.SWIFT_TOOLCHAIN_VERSION }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-swift-${{ env.SWIFT_TOOLCHAIN_VERSION }}-

      - name: Run the full suite N times
        env:
          ITERATIONS: ${{ inputs.iterations || '5' }}
        run: |
          mkdir -p .build/flake-detection
          n="${ITERATIONS:-5}"
          for i in $(seq 1 "$n"); do
            echo "=== flake-detection: iteration $i/$n ==="
            # A failing iteration is the data this job collects, not a step error: without
            # `|| true` the shell's `-e -o pipefail` would abort the loop on the first flake
            # and leave the remaining iterations unrun, which is exactly the signal we need.
            # Each iteration draws a fresh generative seed so the nightly run explores cases
            # beyond the fixed default seed the PR gate pins; the seed is echoed (and lands
            # in the per-iteration log) so any failure reproduces with PK_GENERATIVE_SEED.
            seed="$(( GITHUB_RUN_ID + i ))"
            echo "PK_GENERATIVE_SEED=$seed"
            PK_GENERATIVE_SEED="$seed" \
              swift test --xunit-output ".build/flake-detection/iteration-$i.xml" 2>&1 \
              | tee ".build/flake-detection/iteration-$i.log" || true
          done

      - name: Report flaky tests by name
        if: always()
        run: |
          # Write the Markdown summary once, via --summary, then echo it to the step log.
          # Piping the script into `tee` on the same path would race the script's own write.
          # Exit 1 means flakes were found: record it in the job summary and keep the step
          # red as the nightly signal, but never let it mask a missing report.
          status=0
          python3 Scripts/detect-flaky-tests.py \
            --report .build/flake-detection/iteration-*.xml \
            --summary .build/flake-detection/flake-report.md || status=$?
          if [ -f .build/flake-detection/flake-report.md ]; then
            cat .build/flake-detection/flake-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Publish flake-detection artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flake-detection-report
          path: |
            .build/flake-detection/
          if-no-files-found: ignore
