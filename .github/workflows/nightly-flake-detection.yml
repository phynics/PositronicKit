name: Nightly flake detection

on:
  schedule:
    # 03:17 UTC daily. Reports only — this workflow never gates pull requests.
    - cron: "17 3 * * *"
    # 04:27 UTC every Sunday: the weekly macOS repetition job below. The daily
    # Linux job does not run for this schedule; the weekly run exercises the
    # Apple-only paths (Foundation Models, NaturalLanguage embeddings) the Linux
    # lane never repeats.
    - cron: "27 4 * * 0"
  workflow_dispatch:
    inputs:
      iterations:
        description: "Full-suite repetitions"
        required: false
        default: "5"

permissions:
  contents: read

# Every `run:` step uses an explicit `bash` shell so GitHub Actions applies `-eo pipefail`.
defaults:
  run:
    shell: bash

env:
  SWIFT_TOOLCHAIN_VERSION: "6.4.0"

jobs:
  flake-detection:
    # The daily schedule and manual dispatch; the weekly schedule is the macOS
    # repetition job.
    if: github.event_name != 'schedule' || github.event.schedule == '17 3 * * *'
    name: "Linux — full suite N times, report flakes (Ubuntu 24.04)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Swift ${{ env.SWIFT_TOOLCHAIN_VERSION }}
        run: |
          set -euo pipefail
          archive="swift-${SWIFT_TOOLCHAIN_VERSION}-RELEASE-ubuntu24.04.tar.gz"
          curl -fsSL -o "/tmp/${archive}" \
            "https://download.swift.org/swift-${SWIFT_TOOLCHAIN_VERSION}-release/ubuntu2404/swift-${SWIFT_TOOLCHAIN_VERSION}-RELEASE/${archive}"
          sudo mkdir -p /opt/swift
          sudo tar -xzf "/tmp/${archive}" -C /opt/swift --strip-components=1
          echo "/opt/swift/usr/bin" >> "$GITHUB_PATH"

      - name: Assert Swift 6.4
        run: swift --version | tee /dev/stderr | grep -q 'Swift version 6\.4'

      - name: Cache SwiftPM downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/checkouts
            ~/.swiftpm
          key: swiftpm-${{ runner.os }}-swift-${{ env.SWIFT_TOOLCHAIN_VERSION }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-swift-${{ env.SWIFT_TOOLCHAIN_VERSION }}-

      # `make detect-flakes-run` owns the repetition loop and applies the same
      # $(SWIFT_BUILD_FLAGS) as the PR gate, so a new `-warnings-as-errors`
      # diagnostic reaches the nightly signal too. A failing iteration is data,
      # not a step error: the target always runs every iteration.
      - name: Run the full suite N times
        env:
          ITERATIONS: ${{ inputs.iterations || '5' }}
        run: make detect-flakes-run ITERATIONS="${ITERATIONS:-5}"

      - name: Report flaky tests by name
        if: always()
        run: |
          # Write the Markdown summary once, via --summary, then echo it to the step log.
          # Piping the script into `tee` on the same path would race the script's own write.
          # Exit 1 means flakes were found: record it in the job summary and keep the step
          # red as the nightly signal, but never let it mask a missing report.
          status=0
          python3 Scripts/detect-flaky-tests.py \
            --report .build/flake-detection/iteration-*.xml \
            --summary .build/flake-detection/flake-report.md || status=$?
          if [ -f .build/flake-detection/flake-report.md ]; then
            cat .build/flake-detection/flake-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Publish flake-detection artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-detection-report
          path: |
            .build/flake-detection/
          if-no-files-found: ignore

  # Weekly, on the Apple toolchain: repeat the full suite so the Apple-only paths
  # (Foundation Models, NaturalLanguage embeddings) the Linux lane never builds
  # get the same flake signal. The runner image supplies Swift 6.4.
  macos-repetition:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '27 4 * * 0'
    name: "macOS — full suite N times, report flakes (xcode-27)"
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Assert Swift 6.4
        run: swift --version | tee /dev/stderr | grep -q 'Swift version 6\.4'

      - name: Run the full suite N times
        env:
          ITERATIONS: ${{ inputs.iterations || '5' }}
        run: make detect-flakes-run ITERATIONS="${ITERATIONS:-5}"

      - name: Report flaky tests by name
        if: always()
        run: |
          status=0
          python3 Scripts/detect-flaky-tests.py \
            --report .build/flake-detection/iteration-*.xml \
            --summary .build/flake-detection/flake-report.md || status=$?
          if [ -f .build/flake-detection/flake-report.md ]; then
            cat .build/flake-detection/flake-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Publish flake-detection artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-detection-report-macos
          path: |
            .build/flake-detection/
          if-no-files-found: ignore
