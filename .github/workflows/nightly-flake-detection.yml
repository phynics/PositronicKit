name: Nightly flake detection

on:
  schedule:
    # 03:17 UTC daily. Reports only — this workflow never gates pull requests.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      iterations:
        description: "Full-suite repetitions"
        required: false
        default: "5"

permissions:
  contents: read

# Every `run:` step uses an explicit `bash` shell so GitHub Actions applies `-eo pipefail`.
defaults:
  run:
    shell: bash

jobs:
  flake-detection:
    name: "Linux — full suite N times, report flakes (Ubuntu 24.04)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache SwiftPM downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/checkouts
            ~/.swiftpm
          key: swiftpm-${{ runner.os }}-swift-6.3.3-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-swift-6.3.3-

      - name: Run the full suite N times
        env:
          ITERATIONS: ${{ inputs.iterations || '5' }}
        run: |
          mkdir -p .build/flake-detection
          n="${ITERATIONS:-5}"
          for i in $(seq 1 "$n"); do
            echo "=== flake-detection: iteration $i/$n ==="
            swift test --xunit-output ".build/flake-detection/iteration-$i.xml" 2>&1 | tee ".build/flake-detection/iteration-$i.log"
          done

      - name: Report flaky tests by name
        if: always()
        run: |
          python3 Scripts/detect-flaky-tests.py \
            --report .build/flake-detection/iteration-*.xml \
            --summary .build/flake-detection/flake-report.md | tee .build/flake-detection/flake-report.md

      - name: Publish flake-detection artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flake-detection-report
          path: |
            .build/flake-detection/
          if-no-files-found: ignore
