name: Nix dev shell

on:
  schedule:
    # 04:43 UTC daily. Reports only — this workflow never gates pull requests.
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Every `run:` step uses an explicit `bash` shell so GitHub Actions applies `-eo pipefail`.
defaults:
  run:
    shell: bash

jobs:
  nix-verify-products:
    name: "Linux — nix develop verify-products (Ubuntu 24.04)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The flake is the supported path, so the job fails before the build when
      # the pinned toolchain or its patched libraries are not usable. `nix
      # develop` sets IN_NIX_SHELL, which `make doctor` reads.
      - name: Validate the flake dev shell
        run: nix develop -c make doctor

      - name: Build every library product in the flake dev shell
        run: nix develop -c make verify-products

      - name: Run a focused test in the flake dev shell
        run: nix develop -c swift test --filter MessageContentTests
