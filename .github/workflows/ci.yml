name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: "Linux — Swift 6.3.2 (Ubuntu 24.04)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            curl \
            perl

      - name: Setup Swift 6.3.2
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.3.2"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache SwiftPM downloads
        uses: actions/cache@v4
        with:
          path: |
            .build/checkouts
            ~/.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      - name: Cache Cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('native/pkfastembed/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Verify (make verify-linux-current)
        run: make verify-linux-current
