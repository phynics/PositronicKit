name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Every `run:` step uses an explicit `bash` shell so GitHub Actions applies `-eo pipefail`.
# The implicit default is `bash -e` WITHOUT pipefail, under which a gate piped into `tee`
# reports tee's exit status (always 0) instead of the gate's.
defaults:
  run:
    shell: bash

jobs:
  linux-current:
    name: "Linux — Swift 6.3.3 (Ubuntu 24.04)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache SwiftPM downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/checkouts
            ~/.swiftpm
          key: swiftpm-${{ runner.os }}-swift-6.3.3-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-swift-6.3.3-

      - name: Install SwiftLint
        run: |
          curl -fsSL -o /tmp/swiftlint_linux.zip \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/swiftlint_linux_amd64.zip
          unzip -o /tmp/swiftlint_linux.zip -d /tmp/swiftlint-bin
          echo "/tmp/swiftlint-bin" >> "$GITHUB_PATH"

      - name: Concurrency guardrail scan
        run: |
          swiftlint lint --strict

      - name: Require documentation impact declaration
        if: github.event_name == 'pull_request'
        run: python3 Scripts/check-pr-docs-impact.py

      - name: Verify agent/CI Linux contract
        run: |
          mkdir -p .build
          make verify-linux-agent 2>&1 | tee .build/linux-current.log

      - name: Publish current Linux test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-current-test-log
          path: .build/linux-current.log
          if-no-files-found: ignore

  macos-verify:
    name: "macOS — make verify (macos-latest)"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache SwiftPM downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/checkouts
            ~/.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Verify macOS gate (make verify)
        run: |
          mkdir -p .build
          make verify 2>&1 | tee .build/macos-verify.log

      - name: Publish macOS verify log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-verify-log
          path: .build/macos-verify.log
          if-no-files-found: ignore

  linux-coverage:
    name: "Linux — coverage reports (Ubuntu 24.04)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache SwiftPM downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/checkouts
            ~/.swiftpm
          key: swiftpm-${{ runner.os }}-swift-6.3.3-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-swift-6.3.3-

      - name: Run Linux coverage target
        run: |
          mkdir -p .build
          make verify-linux-coverage 2>&1 | tee .build/linux-coverage.log

      - name: Publish Linux coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-coverage-reports
          path: |
            .build/linux-coverage.log
            .build/linux-coverage/
          if-no-files-found: ignore
