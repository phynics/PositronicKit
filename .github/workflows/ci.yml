name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Every `run:` step uses an explicit `bash` shell so GitHub Actions applies `-eo pipefail`.
# The implicit default is `bash -e` WITHOUT pipefail, under which a gate piped into `tee`
# reports tee's exit status (always 0) instead of the gate's.
defaults:
  run:
    shell: bash

# A newer push to the same pull request supersedes the running gate, so cancel it
# instead of finishing four jobs nobody will read. Pushes to main always run to
# completion because they seed the build cache below.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Single source for the supported toolchain: the install and assert steps read
# it. The build cache keys on the compiler's own `swift --version` instead, so it
# also turns over when a runner image updates Xcode. Named to avoid SWIFT_VERSION, which the swift: images
# export.
env:
  SWIFT_TOOLCHAIN_VERSION: "6.4.0"

jobs:
  # Toolchain-free policy gates. They finish in seconds, so every build job waits
  # on them: a missing docs-impact declaration or a policy violation no longer
  # lets the macOS and iOS jobs run on for fifteen minutes after Linux has failed.
  preflight:
    name: "Preflight — source policy gates"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history with tags: the documentation gate checks that the stable
        # documentation ref is a local Git tag.
        with:
          fetch-depth: 0

      - name: Require documentation impact declaration
        if: github.event_name == 'pull_request'
        run: python3 Scripts/check-pr-docs-impact.py

      - name: Source policy gates (make verify-static)
        run: make verify-static

  linux-verify:
    name: "Linux — Swift 6.4 (Ubuntu 24.04)"
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Install the supported release directly because no pinned runner image
      # or setup-swift entry exists for it.
      - name: Install Swift ${{ env.SWIFT_TOOLCHAIN_VERSION }}
        run: |
          set -euo pipefail
          archive="swift-${SWIFT_TOOLCHAIN_VERSION}-RELEASE-ubuntu24.04.tar.gz"
          curl -fsSL -o "/tmp/${archive}" \
            "https://download.swift.org/swift-${SWIFT_TOOLCHAIN_VERSION}-release/ubuntu2404/swift-${SWIFT_TOOLCHAIN_VERSION}-RELEASE/${archive}"
          sudo mkdir -p /opt/swift
          sudo tar -xzf "/tmp/${archive}" -C /opt/swift --strip-components=1
          echo "/opt/swift/usr/bin" >> "$GITHUB_PATH"

      # Fail before the gate if the selected compiler is not the supported lane,
      # so the job name cannot certify a different toolchain.
      - name: Assert Swift 6.4
        run: swift --version | tee /dev/stderr | grep -q 'Swift version 6\.4'

      # Cache the whole build directory, not just the downloaded sources, so the
      # dependency graph (swift-syntax via the JSONSchema macro, swift-crypto,
      # OpenAI) is not recompiled in debug and release on every run. Checkout
      # gives package sources a fresh mtime, so PositronicKit's own modules still
      # rebuild; only the untouched dependencies are reused. The key names the
      # exact compiler, because modules from another compiler cannot be imported.
      - name: Identify the compiler for the build cache
        id: toolchain
        run: echo "id=$(swift --version 2>&1 | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the build cache
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            ~/.swiftpm
          key: build-linux-verify-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            build-linux-verify-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-

      - name: Install SwiftLint
        run: |
          curl -fsSL -o /tmp/swiftlint_linux.zip \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/swiftlint_linux_amd64.zip
          unzip -o /tmp/swiftlint_linux.zip -d /tmp/swiftlint-bin
          echo "/tmp/swiftlint-bin" >> "$GITHUB_PATH"

      - name: Concurrency guardrail scan
        run: swiftlint lint --strict

      - name: Verify agent/CI Linux contract
        run: |
          mkdir -p .build
          make verify-linux-agent 2>&1 | tee .build/linux-verify.log

      # Only main seeds the cache: pull-request caches are scoped to their own ref,
      # so saving them would spend the repository quota without helping other PRs.
      - name: Save the build cache
        if: success() && github.event_name == 'push' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            ~/.swiftpm
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Publish Linux test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-verify-test-log
          path: .build/linux-verify.log
          if-no-files-found: ignore

  macos-verify:
    name: "macOS — platform gates (xcode-27)"
    needs: preflight
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The xcode-27 image ships Xcode 27, whose bundled Swift 6.4 toolchain is
      # the floor and whose Testing library declares `CustomTestReflectable`.
      # macos-latest still ships the Xcode 26 SDK (Testing 6.3), which lacks it.
      # Using the image toolchain also keeps the symbol-graph extractors in step
      # with the modules built here.
      - name: Assert Swift 6.4
        run: swift --version | tee /dev/stderr | grep -q 'Swift version 6\.4'

      # Cache the whole build directory, not just the downloaded sources, so the
      # dependency graph (swift-syntax via the JSONSchema macro, swift-crypto,
      # OpenAI) is not recompiled in debug and release on every run. Checkout
      # gives package sources a fresh mtime, so PositronicKit's own modules still
      # rebuild; only the untouched dependencies are reused. The key names the
      # exact compiler, because modules from another compiler cannot be imported.
      - name: Identify the compiler for the build cache
        id: toolchain
        run: echo "id=$(swift --version 2>&1 | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the build cache
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            ~/.swiftpm
          key: build-macos-verify-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            build-macos-verify-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-

      # Only the gates whose result depends on the Apple platform. Lint, doc
      # snippets, and the release-mode PKTestSupport and public-consumer builds
      # are platform-neutral and run in linux-verify, so the two lanes together
      # still cover `make verify`.
      - name: Verify macOS platform gates (make verify-macos-ci)
        run: |
          mkdir -p .build
          make verify-macos-ci 2>&1 | tee .build/macos-verify.log

      # Only main seeds the cache: pull-request caches are scoped to their own ref,
      # so saving them would spend the repository quota without helping other PRs.
      - name: Save the build cache
        if: success() && github.event_name == 'push' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            ~/.swiftpm
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Publish macOS verify log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-verify-log
          path: .build/macos-verify.log
          if-no-files-found: ignore

  ios-verify:
    name: "iOS Simulator — PKFoundationModelsProvider (xcode-27)"
    needs: preflight
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The provider's public surface is `@available(anyAppleOS 26, *)`. The macOS
      # lane builds it for macOS only, so a macOS-only availability spelling held
      # the module to the package's iOS 18 floor and broke the iOS build (#206).
      # Building for an iOS Simulator destination keeps that regression caught.
      - name: Assert Swift 6.4
        run: swift --version | tee /dev/stderr | grep -q 'Swift version 6\.4'

      - name: Cache SwiftPM downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/ios-simulator/SourcePackages
            ~/.swiftpm
          key: swiftpm-ios-simulator-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-ios-simulator-${{ runner.os }}-

      # `-skipMacroValidation` is required on an unattended runner: xcodebuild otherwise refuses
      # the vendored `JSONSchemaMacro` from `swift-json-schema` until a human approves it in the
      # Xcode UI. The macro is already pinned through `Package.resolved`, so this trusts the
      # resolved dependency rather than an arbitrary remote one.
      - name: Build PKFoundationModelsProvider for the iOS Simulator
        run: |
          mkdir -p .build
          xcodebuild build \
            -skipMacroValidation \
            -scheme PKFoundationModelsProvider \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/ios-simulator \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee .build/ios-verify.log

      - name: Publish iOS Simulator build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-verify-build-log
          path: .build/ios-verify.log
          if-no-files-found: ignore

  linux-coverage:
    name: "Linux — coverage reports (Ubuntu 24.04)"
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Swift ${{ env.SWIFT_TOOLCHAIN_VERSION }}
        run: |
          set -euo pipefail
          archive="swift-${SWIFT_TOOLCHAIN_VERSION}-RELEASE-ubuntu24.04.tar.gz"
          curl -fsSL -o "/tmp/${archive}" \
            "https://download.swift.org/swift-${SWIFT_TOOLCHAIN_VERSION}-release/ubuntu2404/swift-${SWIFT_TOOLCHAIN_VERSION}-RELEASE/${archive}"
          sudo mkdir -p /opt/swift
          sudo tar -xzf "/tmp/${archive}" -C /opt/swift --strip-components=1
          echo "/opt/swift/usr/bin" >> "$GITHUB_PATH"

      - name: Assert Swift 6.4
        run: swift --version | tee /dev/stderr | grep -q 'Swift version 6\.4'

      # Cache the whole build directory, not just the downloaded sources, so the
      # dependency graph (swift-syntax via the JSONSchema macro, swift-crypto,
      # OpenAI) is not recompiled in debug and release on every run. Checkout
      # gives package sources a fresh mtime, so PositronicKit's own modules still
      # rebuild; only the untouched dependencies are reused. The key names the
      # exact compiler, because modules from another compiler cannot be imported.
      - name: Identify the compiler for the build cache
        id: toolchain
        run: echo "id=$(swift --version 2>&1 | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the build cache
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            ~/.swiftpm
          key: build-linux-coverage-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            build-linux-coverage-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-

      - name: Run Linux coverage target
        run: |
          mkdir -p .build
          make verify-linux-coverage 2>&1 | tee .build/linux-coverage.log

      # Only main seeds the cache: pull-request caches are scoped to their own ref,
      # so saving them would spend the repository quota without helping other PRs.
      - name: Save the build cache
        if: success() && github.event_name == 'push' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            ~/.swiftpm
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Publish Linux coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-coverage-reports
          path: |
            .build/linux-coverage.log
            .build/linux-coverage/
          if-no-files-found: ignore
