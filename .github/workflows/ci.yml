name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-minimum:
    name: "Linux — Swift 6.1.3 (Ubuntu 24.04)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            curl \
            perl \
            libdigest-sha-perl \
            git

      - name: Setup Swift 6.1.3
        uses: swift-actions/setup-swift@7591e4f04c00624cb043783da51a7fd6ee0a6bf6 # v2
        with:
          swift-version: "6.1.3"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable

      - name: Cache SwiftPM downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .build/checkouts
            ~/.swiftpm
          key: swiftpm-${{ runner.os }}-swift-6.1.3-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-swift-6.1.3-

      - name: Cache Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('native/pkfastembed/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Verify minimum Linux gate
        run: make verify-linux-minimum 2>&1 | tee .build/linux-minimum.log

      - name: Publish minimum Linux test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-minimum-test-log
          path: .build/linux-minimum.log
          if-no-files-found: ignore

  linux-current:
    name: "Linux — Swift 6.3.3 (Ubuntu 24.04)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            curl \
            perl \
            libdigest-sha-perl \
            git

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable

      - name: Cache SwiftPM downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .build/checkouts
            ~/.swiftpm
          key: swiftpm-${{ runner.os }}-swift-6.3.3-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-swift-6.3.3-

      - name: Cache Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('native/pkfastembed/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Verify current Linux gate
        run: make verify-linux-current 2>&1 | tee .build/linux-current.log

      - name: Publish current Linux test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-current-test-log
          path: .build/linux-current.log
          if-no-files-found: ignore

  macos:
    name: "macOS — full verification and coverage"
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify macOS gate
        run: make verify 2>&1 | tee .build/macos-verify.log

      - name: Collect test coverage
        run: swift test --enable-code-coverage

      - name: Publish macOS test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-test-coverage
          path: |
            .build/macos-verify.log
            .build/**/codecov/*.json
          if-no-files-found: ignore

  ios:
    name: "iOS — compile and simulator tests"
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Build and test iOS package
        run: |
          set -euo pipefail
          swift package generate-xcodeproj
          xcodebuild \
            -scheme PositronicKit-Package \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath .build/ios-tests.xcresult \
            test

      - name: Publish iOS test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-test-results
          path: .build/ios-tests.xcresult
          if-no-files-found: ignore

      # PositronicKitExamples is a command-line executable and is not an iOS product.
      # PKFastEmbed/CPKFastEmbed are Linux-only native bridge targets and are not public
      # products; MiniLMEmbeddings is therefore intentionally excluded from this job.
