name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Every `run:` step uses an explicit `bash` shell so GitHub Actions applies `-eo pipefail`.
# The implicit default is `bash -e` WITHOUT pipefail, under which a gate piped into `tee`
# reports tee's exit status (always 0) instead of the gate's.
defaults:
  run:
    shell: bash

# Single source for the supported toolchain lane: cache key, install step, and
# assert step all read it.
env:
  SWIFT_NEXT_VERSION: "6.4.0"

jobs:
  linux-verify:
    name: "Linux — Swift 6.4 (Ubuntu 24.04)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Install the supported release directly because no pinned runner image
      # or setup-swift entry exists for it.
      - name: Install Swift ${{ env.SWIFT_NEXT_VERSION }}
        run: |
          set -euo pipefail
          archive="swift-${SWIFT_NEXT_VERSION}-RELEASE-ubuntu24.04.tar.gz"
          curl -fsSL -o "/tmp/${archive}" \
            "https://download.swift.org/swift-${SWIFT_NEXT_VERSION}-release/ubuntu2404/swift-${SWIFT_NEXT_VERSION}-RELEASE/${archive}"
          sudo mkdir -p /opt/swift
          sudo tar -xzf "/tmp/${archive}" -C /opt/swift --strip-components=1
          echo "/opt/swift/usr/bin" >> "$GITHUB_PATH"

      # Fail before the gate if the selected compiler is not the next lane, so
      # the job name cannot certify a different toolchain.
      - name: Assert Swift 6.4
        run: swift --version | tee /dev/stderr | grep -q 'Swift version 6\.4'

      - name: Cache SwiftPM downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/checkouts
            ~/.swiftpm
          key: swiftpm-${{ runner.os }}-swift-${{ env.SWIFT_NEXT_VERSION }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-swift-${{ env.SWIFT_NEXT_VERSION }}-

      - name: Install SwiftLint
        run: |
          curl -fsSL -o /tmp/swiftlint_linux.zip \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/swiftlint_linux_amd64.zip
          unzip -o /tmp/swiftlint_linux.zip -d /tmp/swiftlint-bin
          echo "/tmp/swiftlint-bin" >> "$GITHUB_PATH"

      - name: Concurrency guardrail scan
        run: swiftlint lint --strict

      - name: Require documentation impact declaration
        if: github.event_name == 'pull_request'
        run: python3 Scripts/check-pr-docs-impact.py

      - name: Verify agent/CI Linux contract
        run: |
          mkdir -p .build
          make verify-linux-agent 2>&1 | tee .build/linux-verify.log

      - name: Publish Linux test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-verify-test-log
          path: .build/linux-verify.log
          if-no-files-found: ignore

  macos-verify:
    name: "macOS — make verify (macos-latest)"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Swift ${{ env.SWIFT_NEXT_VERSION }}
        run: |
          set -euo pipefail
          pkg="swift-${SWIFT_NEXT_VERSION}-RELEASE-osx.pkg"
          curl -fsSL -o "/tmp/${pkg}" \
            "https://download.swift.org/swift-${SWIFT_NEXT_VERSION}-release/xcode/swift-${SWIFT_NEXT_VERSION}-RELEASE/${pkg}"
          sudo installer -pkg "/tmp/${pkg}" -target /
          toolchain="/Library/Developer/Toolchains/swift-${SWIFT_NEXT_VERSION}-RELEASE.xctoolchain"
          if [ ! -x "$toolchain/usr/bin/swift" ]; then
            echo "Swift toolchain not found at $toolchain" >&2
            exit 1
          fi
          echo "$toolchain/usr/bin" >> "$GITHUB_PATH"

      - name: Assert Swift 6.4
        run: swift --version | tee /dev/stderr | grep -q 'Swift version 6\.4'

      - name: Cache SwiftPM downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/checkouts
            ~/.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Verify macOS gate (make verify)
        run: |
          mkdir -p .build
          make verify 2>&1 | tee .build/macos-verify.log

      - name: Publish macOS verify log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-verify-log
          path: .build/macos-verify.log
          if-no-files-found: ignore

  linux-coverage:
    name: "Linux — coverage reports (Ubuntu 24.04)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Swift ${{ env.SWIFT_NEXT_VERSION }}
        run: |
          set -euo pipefail
          archive="swift-${SWIFT_NEXT_VERSION}-RELEASE-ubuntu24.04.tar.gz"
          curl -fsSL -o "/tmp/${archive}" \
            "https://download.swift.org/swift-${SWIFT_NEXT_VERSION}-release/ubuntu2404/swift-${SWIFT_NEXT_VERSION}-RELEASE/${archive}"
          sudo mkdir -p /opt/swift
          sudo tar -xzf "/tmp/${archive}" -C /opt/swift --strip-components=1
          echo "/opt/swift/usr/bin" >> "$GITHUB_PATH"

      - name: Assert Swift 6.4
        run: swift --version | tee /dev/stderr | grep -q 'Swift version 6\.4'

      - name: Cache SwiftPM downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/checkouts
            ~/.swiftpm
          key: swiftpm-${{ runner.os }}-swift-${{ env.SWIFT_NEXT_VERSION }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-swift-${{ env.SWIFT_NEXT_VERSION }}-

      - name: Run Linux coverage target
        run: |
          mkdir -p .build
          make verify-linux-coverage 2>&1 | tee .build/linux-coverage.log

      - name: Publish Linux coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-coverage-reports
          path: |
            .build/linux-coverage.log
            .build/linux-coverage/
          if-no-files-found: ignore
